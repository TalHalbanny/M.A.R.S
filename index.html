<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maintenance Reporting System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background:#f8f9fa; }
    .card {
      max-width: 720px;
      margin: 5vh auto;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .card .card-body { padding: 28px; }
    .form-label { font-weight: 600; }
    .btn-primary, .btn-danger { border-radius: 999px; padding: .65rem 1.75rem; }
  </style>
</head>
<body>

  <h1 class="text-center my-4">M.A.R.S - Maintenance And Report System</h1>

  <div class="card">
    <div class="card-body">
      <h3 class="mb-4 text-center">Report Equipment Issue</h3>

      <form id="equipmentForm">
        <div class="mb-3">
          <label for="equipment" class="form-label">Choose Equipment Type</label>
          <select class="form-select" id="equipment" name="equipment" required>
            <option value="" disabled selected>Select an option...</option>
            <option value="Shuttle">Shuttle</option>
            <option value="AGV">AGV</option>
            <option value="RGV">RGV</option>
            <option value="Lift">Lift</option>
          </select>
        </div>

        <div id="dynamicFields"></div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-danger">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container my-4">
    <div class="card text-center mx-auto" style="max-width: 450px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1);">
      <div class="card-body">
        <h5>Get Equipment Report History</h5>
        <br>
        <a href="/history" class="btn btn-danger w-100">Get Report History</a>
      </div>
    </div>
  </div>
<script src="functions.js"></script> 
</body>
</html>
