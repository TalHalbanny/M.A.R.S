<div class="d-flex justify-content-center align-items-center h-100">
    <div class="card card-custom p-4" style="max-width: 500px; width: 100%;">
      <h5 class="mb-3 text-center">New Technician Message</h5>
      <form action="/submit-message" method="POST">

        <div class="mb-3">
          <label for="technician" class="form-label">Technician</label>
          <select class="form-select" id="technician" name="technician">
            <option value="">-- Select Technician --</option>
            <option value="Leonid Goz">Leonid Goz</option>
            <option value="Tal Halbanny">Tal Halbanny</option>
            <option value="Pavel Tishkov">Pavel Tishkov</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="3" placeholder="Enter your message..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Importance</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="importance" id="notice" value="Notice">
            <label class="form-check-label" for="notice">Notice</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="importance" id="important" value="Important">
            <label class="form-check-label" for="important">Important</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="importance" id="alert" value="Alert">
            <label class="form-check-label" for="alert">Alert</label>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-danger rounded-pill">Submit</button>
        </div>
      </form>
    </div>
  </div>
