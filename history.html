<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maintenance History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f2f4f7;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 900px;
      margin: 5vh auto;
    }
    .card {
      border-radius: 16px;
      padding: 30px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1, h3 {
      text-align: center;
      margin-bottom: 30px;
    }
    table {
      margin-top: 20px;
    }
    th {
      background-color: #f12e2e !important;
      color: #fff;
    }
    td, th {
      vertical-align: middle;
    }

    th:nth-child(4),
    td:nth-child(4) {
    width: 140px; 
  }

  </style>
</head>
<body>

<br>
<h1 class="text-center">M.A.R.S - Maintenance And Report System</h1>

<div class="form-group mt-3 text-center">
  <label for="monthFilter"><strong>Filter by Year & Month:</strong></label>
  <input type="month" id="monthFilter" class="form-control d-inline-block w-auto">
</div>


<div class="container">
  <div class="card">
    <h1>Maintenance Report History</h1>
    <h3>Select Equipment Type</h3>

    <form id="historyForm" class="text-center mb-4">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="equipment" value="Shuttle" required>
        <label class="form-check-label">Shuttle</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="equipment" value="AGV">
        <label class="form-check-label">AGV</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="equipment" value="RGV">
        <label class="form-check-label">RGV</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="equipment" value="Lift">
        <label class="form-check-label">Lift</label>
      </div>
      <br>
      <br>
      <button type="submit" class="btn btn-danger mt-3">View History</button>
    </form>

    <div id="results" class="table-responsive d-none">
      <table class="table table-bordered table-striped text-center">
        <thead>
          <tr>
            <th>Reported At</th>
            <th>Shuttle/Lift</th>
            <th>Hour</th>
            <th>Date</th>
            <th>Issue</th>
            <th>Fixed By</th>
            <th>Solution</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</div>


 <div class="card text-center mx-auto" style="max-width: 450px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1);">
    <div class="card-body">
      <h5>Return to Report Screen</h5>
      <br>
      <a href="/" class="btn btn-danger w-100">Report Screen</a>
    </div>
</div>

<script>
document.getElementById('historyForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const equipment = document.querySelector('input[name="equipment"]:checked').value;
  const month = document.getElementById('monthFilter').value;

  try {
    // send both equipment and month
    const res = await fetch('/get-history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ equipment, month })
    });

    const data = await res.json();

    const resultsDiv = document.getElementById('results');
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7">No records found.</td></tr>';
    } else {
      data.forEach(doc => {
        tbody.innerHTML += `
          <tr>
            <td>${doc.reportedAt || 'N/A'}</td>
            <td>${doc.shuttleNum || doc.agvNum || doc.rgvNum || doc.liftNum || 'N/A'}</td>
            <td>${doc.hour || 'N/A'}</td>
            <td>${doc.date || 'N/A'}</td>
            <td>${doc.notes || 'N/A'}</td>
            <td>${doc.fixedBy || 'N/A'}</td>
            <td>${doc.solution || 'N/A'}</td>
          </tr>
        `;
      });
    }

    resultsDiv.classList.remove('d-none');
  } catch (err) {
    console.error("Error fetching history:", err);
    alert("Failed to fetch history. Please try again.");
  }
});
</script>


</body>
</html>
