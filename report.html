<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="indexstyle.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Report Issue</title>
          <style>
    body { background:#f8f9fa; }
    .card {
      max-width: 720px;
      margin: 5vh auto;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .card .card-body { padding: 28px; }
    .form-label { font-weight: 600; }
    .btn-primary, .btn-danger { border-radius: 999px; padding: .65rem 1.75rem; }

    .navbar-nav .nav-link {
      transition: color 0.3s ease;
    }
    .navbar-nav .nav-link:hover {
      color: var(--bs-danger) !important;
    }

    /* Make navbar full width and fixed height */
.navbar {
  width: 100%;         /* Full screen width */
  min-height: 60px;    /* Set a consistent height */
  padding-top: 0.5rem; /* Optional: adjust vertical padding */
  padding-bottom: 0.5rem;
}

.navbar-brand {
  line-height: 1;      /* Ensures the brand aligns nicely vertically */
}

.navbar .navbar-nav .nav-link {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light shadow">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger" href="/">Megastore M.A.R.S</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active text-dark" aria-current="page" href="/">Main</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="/report">Report Issue</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="/history">Report History</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="/createtask">Create Crew Task</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="/shuttle_stat.html">Monitoring</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <div class="card">
    <div class="card-body">
      <h3 class="mb-4 text-center">Report Equipment Issue</h3>

      <form id="equipmentForm">
        <div class="mb-3">
          <label for="equipment" class="form-label">Choose Equipment Type</label>
          <select class="form-select" id="equipment" name="equipment" required>
            <option value="" disabled selected>Select an option...</option>
            <option value="Shuttle">Shuttle</option>
            <option value="AGV">AGV</option>
            <option value="RGV">RGV</option>
            <option value="Lift">Lift</option>
          </select>
        </div>

        <div id="dynamicFields"></div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-danger">Submit</button>
        </div>
      </form>
    </div>
  </div>


<footer class="footer-custom mt-5 text-center py-3">
  <div>
    <small class="text-muted d-block">2025 All rights reserved © </small>
    <small class="text-muted d-block">Developed and Designed by AnyWeb ©</small>
  </div>
</footer>


<script src="functions.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
